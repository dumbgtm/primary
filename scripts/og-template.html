<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG template</title>
<!-- dumbGTM "HR Memo" share card, 1200x630. Params: kicker (RE line), text (headline). -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap');
  :root { --memo:#FBFAF6; --ink:#141414; --ink-2:#3D3D39; --muted:#5C5C56; --rule:#DAD8D0; --highlighter:#F5EE6A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: var(--memo); overflow: hidden; }
  .canvas { width: 1200px; height: 630px; padding: 64px 80px 56px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--ink); padding-bottom: 16px; }
  .wordmark { font-family: 'Libre Caslon Text', serif; font-weight: 700; font-size: 32px; color: var(--ink); }
  .stamp { font-family: 'Space Mono', monospace; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; background: var(--ink); color: var(--memo); padding: 6px 14px; }
  .memo { display: grid; grid-template-columns: 110px 1fr; row-gap: 6px; font-family: 'Space Mono', monospace; font-size: 20px; color: var(--muted); margin-top: 36px; }
  .memo .re { color: var(--ink); }
  .headline { font-family: 'Libre Caslon Text', serif; font-size: 60px; line-height: 1.1; color: var(--ink); margin-top: 32px; max-width: 1040px; }
  .headline.long { font-size: 46px; }
  .headline.short { font-size: 76px; }
  .bottom { margin-top: auto; border-top: 1px solid var(--ink); padding-top: 3px; }
  .bottom::before { content: ''; display: block; border-top: 1px solid var(--ink); }
  .foot { display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 18px; color: var(--muted); padding-top: 14px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="top">
    <div class="wordmark">dumbgtm</div>
    <div class="stamp">Internal memo</div>
  </div>
  <div class="memo">
    <div>TO:</div><div>All Sales, Marketing &amp; Whoever</div>
    <div>RE:</div><div class="re" id="kicker">Blog post</div>
  </div>
  <div class="headline" id="headline">Placeholder headline text goes here.</div>
  <div class="bottom">
    <div class="foot"><span>dumbgtm.com</span><span>Celebrating dumb marketing ideas.</span></div>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const kicker = params.get('kicker') || 'Blog post';
  const text = params.get('text') || 'Placeholder headline text goes here.';
  document.getElementById('kicker').textContent = kicker;
  const h = document.getElementById('headline');
  h.textContent = text;
  if (text.length > 90) h.classList.add('long');
  else if (text.length < 40) h.classList.add('short');
</script>
</body>
</html>
