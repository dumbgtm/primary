<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG template</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Inter+Tight:wght@800&display=swap');
  :root {
    --paper: #E9FFF9;
    --ink: #1D3354;
    --siren: #D64045;
    --frost: #9ED8DB;
    --cerulean: #467599;
    --slate: #5B6B85;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1200px; height: 630px;
    background: var(--paper);
    overflow: hidden;
  }
  .canvas {
    position: relative;
    width: 1200px; height: 630px;
    font-family: 'Inter', sans-serif;
  }
  .blob {
    position: absolute;
    top: -180px; right: -180px;
    width: 520px; height: 520px;
    border-radius: 50%;
    background: rgba(158,216,219,0.35);
  }
  .blob2 {
    position: absolute;
    bottom: -220px; left: -160px;
    width: 460px; height: 460px;
    border-radius: 50%;
    background: rgba(214,64,69,0.08);
  }
  .content {
    position: relative;
    z-index: 1;
    padding: 72px 88px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .wordmark {
    font-family: 'Inter Tight', sans-serif;
    font-weight: 800;
    font-size: 28px;
    color: var(--ink);
    text-transform: lowercase;
    letter-spacing: -0.5px;
  }
  .kicker {
    display: inline-block;
    font-family: 'Inter Tight', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--siren);
    margin-bottom: 28px;
  }
  .headline {
    font-family: 'Inter Tight', sans-serif;
    font-weight: 800;
    font-size: 54px;
    line-height: 1.15;
    color: var(--ink);
    max-width: 980px;
  }
  .headline.long { font-size: 44px; }
  .headline.short { font-size: 64px; }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .domain {
    font-family: 'Inter Tight', sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: var(--slate);
  }
  .quotemark {
    font-family: Georgia, serif;
    font-size: 180px;
    color: var(--frost);
    position: absolute;
    top: 20px;
    right: 60px;
    line-height: 1;
    z-index: 0;
    opacity: 0.6;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="blob"></div>
  <div class="blob2"></div>
  <div class="content">
    <div>
      <div class="wordmark">dumb gtm</div>
    </div>
    <div>
      <div class="kicker" id="kicker">HOT TAKE</div>
      <div class="headline" id="headline">Placeholder headline text goes here.</div>
    </div>
    <div class="footer">
      <div class="domain">dumbgtm.com</div>
    </div>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const kicker = params.get('kicker') || 'HOT TAKE';
  const text = params.get('text') || 'Placeholder headline text goes here.';
  document.getElementById('kicker').textContent = kicker;
  const headlineEl = document.getElementById('headline');
  headlineEl.textContent = text;
  if (text.length > 140) headlineEl.classList.add('long');
  else if (text.length < 50) headlineEl.classList.add('short');
</script>
</body>
</html>
