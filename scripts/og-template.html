<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG template</title>
<!--
  dumbGTM share cards, 1200x630 (Graphics Kit §06; logo per the logo handoff, wordmark 44px tall).
  ?mode=memo&...&fig=AI+SDRs                            -> same card with a mini Fig. 1 loop chart on the right,
                                                          marker on the post's stage, labelled with `fig`
  ?mode=default                                        -> og/default.png (APPROVED stamp)
  ?mode=memo&memo=003&stage=4&title=...&italic=...&date=Sep+6,+2026
                                                       -> og/blog/<slug>.png (FILED stamp)
  `italic` is the punchline part of the title, set in italics.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap');
  :root { --memo:#FBFAF6; --ink:#141414; --ink-2:#3D3D39; --muted:#5C5C56; --highlighter:#F5EE6A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: var(--memo); overflow: hidden; color: var(--ink); }
  .canvas { position: relative; width: 1200px; height: 630px; padding: 64px 72px; display: flex; flex-direction: column; }
  .head { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--ink); padding-bottom: 20px; }
  .logo { display: block; height: 44px; width: auto; }
  .right { display: flex; align-items: center; gap: 20px; font-family: 'Space Mono', monospace; font-size: 22px; text-transform: uppercase; letter-spacing: .06em; }
  .stage-tag { display: inline-flex; align-items: center; gap: 10px; border: 2px solid var(--ink); padding: 6px 14px; font-size: 18px; }
  .memo-head { display: grid; grid-template-columns: 120px 1fr; row-gap: 8px; font-family: 'Space Mono', monospace; font-size: 24px; color: var(--muted); margin-top: 36px; }
  .memo-head .re { color: var(--ink); }
  .display { font-family: 'Libre Caslon Text', serif; font-size: 104px; line-height: 1.02; margin-top: 32px; }
  .display mark { background: var(--highlighter); color: var(--ink); padding: 0 8px; }
  .title { font-family: 'Libre Caslon Text', serif; font-size: 72px; line-height: 1.08; max-width: 1000px; margin-top: 44px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .title.long { font-size: 60px; }
  .foot { margin-top: auto; font-family: 'Space Mono', monospace; font-size: 22px; color: var(--muted); }
  .body { display: flex; gap: 48px; align-items: flex-start; margin-top: 40px; }
  .body .title { margin-top: 0; font-size: 60px; max-width: 600px; -webkit-line-clamp: 4; }
  .body .title.long { font-size: 52px; }
  .fig { flex: 0 0 420px; border: 2px solid var(--ink); background: #fff; }
  .fig-head { display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; padding: 10px 14px; border-bottom: 1px solid var(--ink); }
  .fig svg { display: block; width: 100%; height: auto; }
  .fig-cap { font-family: 'Libre Caslon Text', serif; font-style: italic; font-size: 17px; line-height: 1.3; color: var(--ink-2); padding: 2px 16px 14px; }
  .stamp { position: absolute; right: 72px; bottom: 56px; border: 4px solid var(--ink); padding: 5px; opacity: .85; mix-blend-mode: multiply; }
  .stamp span { display: block; border: 2px solid var(--ink); padding: 10px 24px; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 30px; letter-spacing: .12em; text-transform: uppercase; line-height: 1; }
</style>
</head>
<body>
<div class="canvas" id="c"></div>
<script>
  const q = new URLSearchParams(location.search);
  const esc = (s) => s.replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]);
  const MARKS = {
    1: '<circle cx="12" cy="12" r="3"/>',
    2: '<path d="M4 18l6-6 4 3 6-9"/><path d="M15 6h5v5"/>',
    3: [6, 12, 18].flatMap((y) => [6, 12, 18].map((x) => `<circle cx="${x}" cy="${y}" r="1.5"/>`)).join(''),
    4: '<path d="M4 10h16M4 14h16"/>',
  };
  const NAMES = { 1: 'Dumb', 2: 'Working', 3: 'Everywhere', 4: 'Boring' };
  const mark = (n) => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">${MARKS[n]}</svg>`;
  // Official wordmark (logo handoff). Served from the website root: /public/brand/...
  const LOGO = window.LOGO_SRC || '../public/brand/dumbgtm-wordmark.svg';
  // Mini "Fig. 1: The dumb idea loop" (same geometry as src/lib/loop.ts), with a marker on stage n.
  function loopFig(n, label) {
    const RES = [[30,236],[122,230],[140,205],[215,72],[240,50],[268,54],[300,84],[340,98],[400,100]];
    const EVR = [[30,246],[150,246],[200,200],[260,96],[300,80],[340,98],[400,100]];
    const HEAD = { 1: [76,233], 2: [180,135], 3: [268,54], 4: [360,99] }[n];
    const pts = (a) => a.map((p) => p.join(',')).join(' ');
    const Z = [30,122.5,215,307.5,400];
    const zl = [0,1,2,3].map((i) => `<text x="${(Z[i]+Z[i+1])/2}" y="272" text-anchor="middle" font-family="Space Mono" font-size="11" letter-spacing="1" fill="${i+1===n?'#141414':'#5C5C56'}" font-weight="${i+1===n?700:400}">§${i+1}</text>`).join('');
    const zr = [1,2,3].map((i) => `<line x1="${Z[i]}" y1="20" x2="${Z[i]}" y2="250" stroke="#DAD8D0"/>`).join('');
    const lw = esc(label).length * 8.4 + 20;
    const lx = Math.min(Math.max(HEAD[0], lw/2 + 34), 404 - lw/2);
    return `<div class="fig"><div class="fig-head"><span>Fig. 1: The dumb idea loop</span><span>§1–§4 ↻</span></div>
      <svg viewBox="0 0 410 290">${zr}${zl}
        <polyline points="30,14 30,250 404,250" fill="none" stroke="#141414" stroke-width="1.5"/>
        <text x="36" y="26" font-family="Space Mono" font-size="11" fill="#5C5C56" letter-spacing="1">RESULTS</text>
        <polyline points="${pts(EVR)}" fill="none" stroke="#9A9A96" stroke-width="1.5" stroke-dasharray="5 5"/>
        <polyline points="${pts(RES)}" fill="none" stroke="#141414" stroke-width="3"/>
        <circle cx="${HEAD[0]}" cy="${HEAD[1]}" r="8" fill="#F5EE6A" stroke="#141414" stroke-width="2"/>
        <rect x="${lx - lw/2}" y="${HEAD[1] + 16}" width="${lw}" height="22" fill="#141414"/>
        <text x="${lx}" y="${HEAD[1] + 31}" text-anchor="middle" font-family="Space Mono" font-size="12" font-weight="700" letter-spacing="1" fill="#FBFAF6">${esc(label).toUpperCase()}</text>
      </svg>
      <div class="fig-cap">${esc(q.get('caption') || 'Results flatten once everyone copies it.')}</div></div>`;
  }
  const c = document.getElementById('c');
  if (q.get('mode') === 'memo') {
    const n = q.get('stage');
    const title = q.get('title') || 'Untitled memo';
    const it = q.get('italic') || '';
    const i = it ? title.lastIndexOf(it) : -1;
    const html = i >= 0 ? esc(title.slice(0, i)) + '<em>' + esc(it) + '</em>' + esc(title.slice(i + it.length)) : esc(title);
    const fig = q.get('fig');
    const titleHtml = `<div class="title ${title.length > (fig ? 70 : 90) ? 'long' : ''}">${html}</div>`;
    c.innerHTML = `
      <div class="head"><img class="logo" src="${LOGO}" alt="dumbgtm">
        <div class="right"><span>Memo ${esc(q.get('memo') || '001')}</span>${n ? `<span class="stage-tag">${mark(n)}§${n} ${NAMES[n]}</span>` : ''}</div></div>
      ${fig ? `<div class="body">${titleHtml}${loopFig(Number(n) || 3, fig)}</div>` : titleHtml}
      <div class="foot">${esc(q.get('date') || '')} · dumbgtm.com/blog</div>
      <div class="stamp" style="transform: rotate(4deg)${fig ? '; right: 560px; bottom: 128px' : ''}"><span>Filed</span></div>`;
  } else {
    c.innerHTML = `
      <div class="head"><img class="logo" src="${LOGO}" alt="dumbgtm"><div class="right">dumbgtm.com</div></div>
      <div class="memo-head"><div>TO:</div><div>All Sales, Marketing &amp; Whoever</div><div>RE:</div><div class="re">silly. goofy. dense. fun.</div></div>
      <div class="display">So <mark>dumb</mark> it <em>might work.</em></div>
      <div class="stamp" style="transform: rotate(-5deg)"><span>Approved</span></div>`;
  }
</script>
</body>
</html>
